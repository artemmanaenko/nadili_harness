<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="816" viewBox="0 0 1080 816" role="img" aria-labelledby="title desc">
<title id="title">I decide. The harness coordinates.</title>
<desc id="desc">I choose the goal, approve the plan and start implementation. The harness coordinates a builder, independent review and applicable runtime testing. Findings return to the builder for fixes and repeated checks within the allowed attempts. Scope changes, exhausted limits and blockers stop progress and return to me for a decision. Passing review, applicable QA and final checks produces a checked change.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#a0a7ae" stroke-width="1.5"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#d1ab6c" stroke-width="1.5"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#41a892" stroke-width="1.5"/></marker>
</defs>
<rect width="1080" height="816" rx="12" fill="#171717"/>
<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#eeeeee">
