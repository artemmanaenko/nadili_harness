<text x="180" y="246" font-size="19" fill="#cbd0d5" font-weight="400">Approve the plan</text>
<text x="180" y="274" font-size="19" fill="#cbd0d5" font-weight="400">Then start work</text>
<text x="704" y="128" font-size="23" fill="#eeeeee" font-weight="600">Carry the work between agents</text>
<rect x="392" y="180" width="192" height="112" rx="20" fill="none" stroke="#565b61" stroke-width="2"/>
<text x="488" y="223" font-size="23" fill="#eeeeee" font-weight="600">Build</text>
<text x="488" y="258" font-size="18" fill="#cbd0d5" font-weight="400">Executor</text>
<rect x="608" y="180" width="192" height="112" rx="20" fill="none" stroke="#565b61" stroke-width="2"/>
<text x="704" y="223" font-size="23" fill="#eeeeee" font-weight="600">Review</text>
<text x="704" y="258" font-size="18" fill="#cbd0d5" font-weight="400">Independent</text>
<rect x="824" y="180" width="192" height="112" rx="20" fill="none" stroke="#565b61" stroke-width="2"/>
<text x="920" y="223" font-size="23" fill="#eeeeee" font-weight="600">Test</text>
<text x="920" y="258" font-size="18" fill="#cbd0d5" font-weight="400">Runtime, if needed</text>
