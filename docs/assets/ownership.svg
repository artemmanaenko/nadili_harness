<text x="704" y="442" font-size="22" fill="#eeeeee" font-weight="600">Keep the work bounded</text>
<text x="704" y="475" font-size="18" fill="#cbd0d5" font-weight="400">Remember findings · Count attempts · Share test resources</text>
