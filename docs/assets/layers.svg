<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="666" viewBox="0 0 1080 666" role="img" aria-labelledby="title desc">
<title id="title">The three layers of the Nadili harness</title>
<desc id="desc">The harness layer owns delivery stages, roles, checks and limits. The adapter layer maps workflow methods to harness rules. The workflow layer contains gstack, the active workflow; TRIP, retained for legacy items; and other workflows as possible future extensions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#a0a7ae" stroke-width="1.5"/></marker></defs>
<rect width="1080" height="666" rx="12" fill="#171717"/>
<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#eeeeee">
<rect x="40" y="28" width="1000" height="170" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="540" y="57" font-size="21">Harness layer</text>
<rect x="64" y="85" width="952" height="89" rx="22" fill="#171717" stroke="#565b61" stroke-width="1.5"/>
<text x="540" y="122" font-size="22" font-weight="600">My delivery rules</text>
<text x="540" y="151" font-size="20" fill="#cbd0d5">Stages, roles, checks and limits</text>
<path d="M 540 204 V 237" fill="none" stroke="#a0a7ae" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="248" width="1000" height="170" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="540" y="277" font-size="21">Adapter layer</text>
<rect x="64" y="305" width="952" height="89" rx="22" fill="#171717" stroke="#565b61" stroke-width="1.5"/>
<text x="540" y="342" font-size="22" font-weight="600">My adapters</text>
<text x="540" y="371" font-size="20" fill="#cbd0d5">Map workflow methods to harness rules</text>
<path d="M 540 424 V 457" fill="none" stroke="#a0a7ae" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="468" width="1000" height="170" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="540" y="497" font-size="21">Workflow layer</text>
<rect x="64" y="525" width="280" height="89" rx="22" fill="#171717" stroke="#41a892" stroke-width="2.5"/>
<text x="204" y="578" font-size="22" font-weight="600">gstack</text>
<rect x="400" y="525" width="280" height="89" rx="22" fill="#171717" stroke="#8b949e" stroke-width="1.5"/>
<text x="540" y="578" font-size="22" font-weight="600">TRIP</text>
<rect x="736" y="525" width="280" height="89" rx="22" fill="#171717" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="876" y="578" font-size="22" font-weight="600">Other workflows</text>
</g></svg>
